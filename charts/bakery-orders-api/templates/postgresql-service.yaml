apiVersion: v1
kind: Service
metadata:
  name: {{ include "bakery-orders-api.postgresql.fullname" . }}
  labels:
    {{- include "bakery-orders-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "bakery-orders-api.postgresql.selectorLabels" . | nindent 4 }}
