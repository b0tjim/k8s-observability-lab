apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bakery-orders-api.postgresql.fullname" . }}
  labels:
    {{- include "bakery-orders-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  # Full connection string the app reads (same format as bakery-orders-api's docker-compose).
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgresql.user .Values.postgresql.password (include "bakery-orders-api.postgresql.fullname" .) .Values.postgresql.database | quote }}
