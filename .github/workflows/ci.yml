name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Helm lint + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Helm lint
        run: make lint

      - name: Validate rendered manifests against Kubernetes schemas
        run: make validate

      - name: Check dashboard JSON is valid
        run: jq empty charts/bakery-orders-api/dashboards/*.json

  kind:
    name: Deploy to kind
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: bakery-lab
          config: kind/cluster.yaml

      - name: Build the app image and load it into kind
        run: make image

      - name: Install the chart and wait for rollout
        run: make install

      - name: Smoke test (health, create an order, list it back)
        run: make smoke

      - name: Generate a little traffic
        run: make load REQUESTS=30

      - name: Install kube-prometheus-stack
        run: make monitoring-up

      - name: Enable the ServiceMonitor and alerts
        run: make install HELM_ARGS="--set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true"

      - name: Assert Prometheus scrapes the app
        run: make check-metrics

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/component=api --tail=100 || true
          kubectl -n monitoring get pods || true
